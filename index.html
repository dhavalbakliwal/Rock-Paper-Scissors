<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epic Rock Paper Scissors</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a, #1e1b4b, #311042);
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --primary-glow: #8b5cf6;
            --secondary-glow: #ec4899;
            --text-color: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 2rem;
            text-align: center;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            background: linear-gradient(to right, #c084fc, #f472b6, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        /* Scoreboard */
        .scoreboard {
            display: flex;
            justify-content: space-around;
            margin-bottom: 2rem;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .score-card {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .score-card span {
            font-size: 0.9rem;
            color: #94a3b8;
            font-weight: 600;
            text-transform: uppercase;
        }

        .score-card .score {
            font-size: 2rem;
            font-weight: 800;
            color: #fff;
        }

        /* Arena / Battleground */
        .battle-arena {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 140px;
            margin-bottom: 2rem;
            padding: 0 1rem;
        }

        .fighter {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 120px;
        }

        .fighter span {
            font-size: 0.85rem;
            margin-top: 8px;
            color: #cbd5e1;
            font-weight: 600;
        }

        .battle-icon {
            font-size: 3.5rem;
            height: 90px;
            width: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 50%;
            border: 2px dashed rgba(255, 255, 255, 0.15);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .vs-text {
            font-size: 1.5rem;
            font-weight: 800;
            color: #64748b;
            font-style: italic;
        }

        /* Status / Results Message */
        .message-box {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 2rem;
            min-height: 2rem;
            color: #e2e8f0;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        /* Controls / Choices */
        .choices {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
        }

        .choice-btn {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02));
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            width: 85px;
            height: 85px;
            font-size: 2.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .choice-btn:hover {
            transform: translateY(-5px);
            background: linear-gradient(145deg, rgba(139, 92, 246, 0.3), rgba(236, 72, 153, 0.3));
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 12px 25px rgba(139, 92, 246, 0.3);
        }

        .choice-btn:active {
            transform: translateY(2px);
        }

        /* Animations */
        @keyframes shake {
            0% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(-15deg) scale(1.1); }
            50% { transform: rotate(15deg) scale(1.1); }
            75% { transform: rotate(-10deg) scale(1.1); }
            100% { transform: rotate(0deg) scale(1); }
        }

        .shaking {
            animation: shake 0.4s ease infinite;
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            80% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .pop {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .winner-glow {
            box-shadow: 0 0 25px #34d399 !important;
            border-color: #34d399 !important;
        }

        .loser-glow {
            box-shadow: 0 0 25px #f87171 !important;
            border-color: #f87171 !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Rock • Paper • Scissors</h1>

        <!-- Scoreboard -->
        <div class="scoreboard">
            <div class="score-card">
                <span>Player</span>
                <div class="score" id="player-score">0</div>
            </div>
            <div class="score-card">
                <span>Draws</span>
                <div class="score" id="draw-score">0</div>
            </div>
            <div class="score-card">
                <span>Computer</span>
                <div class="score" id="computer-score">0</div>
            </div>
        </div>

        <!-- Battle Arena -->
        <div class="battle-arena">
            <div class="fighter">
                <div class="battle-icon" id="player-display">❓</div>
                <span>You</span>
            </div>
            <div class="vs-text">VS</div>
            <div class="fighter">
                <div class="battle-icon" id="computer-display">❓</div>
                <span>Computer</span>
            </div>
        </div>

        <!-- Result Status Message -->
        <div class="message-box" id="message">Choose your weapon!</div>

        <!-- Controls -->
        <div class="choices">
            <button class="choice-btn" onclick="playGame('rock')" title="Rock">✊</button>
            <button class="choice-btn" onclick="playGame('paper')" title="Paper">✋</button>
            <button class="choice-btn" onclick="playGame('scissors')" title="Scissors">✌️</button>
        </div>
    </div>

    <script>
        // Web Audio API Sound Synthesizer (No external files required!)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
                gainNode.gain.setValueAtTime(0.15, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'win') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.setValueAtTime(450, now + 0.1);
                osc.frequency.setValueAtTime(600, now + 0.2);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'lose') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(120, now + 0.3);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'draw') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(250, now);
                osc.frequency.setValueAtTime(250, now + 0.15);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        const emojis = {
            rock: '✊',
            paper: '✋',
            scissors: '✌️'
        };

        let scores = { player: 0, computer: 0, draw: 0 };
        let isPlaying = false;

        function playGame(playerChoice) {
            if (isPlaying) return;
            isPlaying = true;
            playSound('click');

            const playerDisplay = document.getElementById('player-display');
            const computerDisplay = document.getElementById('computer-display');
            const message = document.getElementById('message');

            // Reset styles and trigger shaking animation
            playerDisplay.className = 'battle-icon shaking';
            computerDisplay.className = 'battle-icon shaking';
            playerDisplay.textContent = '✊';
            computerDisplay.textContent = '✊';
            message.textContent = 'Battling...';

            setTimeout(() => {
                const choices = ['rock', 'paper', 'scissors'];
                const computerChoice = choices[Math.floor(Math.random() * 3)];

                // Assign icons and pop-in animations
                playerDisplay.textContent = emojis[playerChoice];
                computerDisplay.textContent = emojis[computerChoice];

                playerDisplay.className = 'battle-icon pop';
                computerDisplay.className = 'battle-icon pop';

                let result = '';
                if (playerChoice === computerChoice) {
                    result = 'draw';
                    scores.draw++;
                    message.textContent = "It's a Draw! 🤝";
                    playSound('draw');
                } else if (
                    (playerChoice === 'rock' && computerChoice === 'scissors') ||
                    (playerChoice === 'paper' && computerChoice === 'rock') ||
                    (playerChoice === 'scissors' && computerChoice === 'paper')
                ) {
                    result = 'win';
                    scores.player++;
                    message.textContent = 'You Win! 🎉';
                    playerDisplay.classList.add('winner-glow');
                    computerDisplay.classList.add('loser-glow');
                    playSound('win');
                } else {
                    result = 'lose';
                    scores.computer++;
                    message.textContent = 'Computer Wins! 😢';
                    playerDisplay.classList.add('loser-glow');
                    computerDisplay.classList.add('winner-glow');
                    playSound('lose');
                }

                // Update score board
                document.getElementById('player-score').textContent = scores.player;
                document.getElementById('draw-score').textContent = scores.draw;
                document.getElementById('computer-score').textContent = scores.computer;

                isPlaying = false;
            }, 600);
        }
    </script>
</body>
</html>
